# Scheduling for the Robinhood Chain tab.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan caps
# cron jobs at one run per day, and history is only useful at finer resolution:
# the upstream APIs report levels, so week-over-week deltas and sparklines come
# entirely from these snapshots.
name: Robinhood snapshots

on:
  schedule:
    # Every 30 minutes. GitHub may delay runs under load; snapshots are
    # timestamped server-side, so a late run is recorded accurately.
    - cron: '0,30 * * * *'
    # Daily X follower refresh (skipped unless CRON_SECRET is configured).
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'snapshot'
        type: choice
        options: [snapshot, followers]

env:
  SITE: https://www.fcmonitor.com

jobs:
  snapshot:
    if: github.event.schedule != '15 13 * * *' && inputs.job != 'followers'
    runs-on: ubuntu-latest
    steps:
      - name: Record a watchlist snapshot
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$SITE/api/robinhood-snapshot")
          echo "HTTP $code"
          cat /tmp/out.json
          # 401 means CRON_SECRET is set on Vercel but missing here.
          if [ "$code" != "200" ]; then exit 1; fi

  followers:
    if: github.event.schedule == '15 13 * * *' || inputs.job == 'followers'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh X follower counts
        # Costs Apify credits, so it never runs without an explicit secret.
        if: ${{ secrets.CRON_SECRET != '' }}
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$SITE/api/robinhood-x?refresh=1")
          echo "HTTP $code"
          cat /tmp/out.json
          if [ "$code" != "200" ]; then exit 1; fi
