    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FC Monitor",
      "alternateName": "FCMonitor",

      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "FCMonitor"
      },
      "featureList": [
        "Bitcoin on-chain level monitoring",
        "BTC ETF flow tracking",
        "Stablecoin health and depeg detection",
        "Macro signal indicators",

        "Token portfolio tracking",

      "keywords": "crypto, bitcoin, ETF flows, stablecoin, DeFi, on-chain analysis, crypto dashboard"
    }
